# Buduje strone i publikuje ja na GitHub Pages po kazdym pushu na master.
# Deploy = push katalogu out/ na galaz gh-pages, ktora Pages serwuje.
# Adres: https://qba-abq.github.io/1vhuqszy/
name: Deploy na GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-i-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zaleznosci
        run: npm ci

      - name: Build (eksport statyczny)
        run: npm run build
        env:
          DEPLOY_BASE: /1vhuqszy

      - name: Wylacz Jekylla (katalogi _next musza przejsc)
        run: touch out/.nojekyll

      - name: Publikacja na gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
